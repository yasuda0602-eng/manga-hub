<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マンガハブ</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--tx:#101828;--sub:#667085;--ac:#3b4cca;--acx:#fff;--bd:#d8dde6;--hl:#ffd23f;--hlx:#101828;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2030;--tx:#eef1f6;--sub:#9aa4b5;--ac:#8c98ff;--acx:#0f1420;--bd:#2c3448;--hl:#ffd23f;--hlx:#101828;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#1a2030;--tx:#eef1f6;--sub:#9aa4b5;--ac:#8c98ff;--acx:#0f1420;--bd:#2c3448;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 80px}
h1{font-size:22px;margin:4px 0 10px;letter-spacing:.02em}
h2{font-size:16px;margin:22px 0 8px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.day{border:1px solid var(--bd);background:var(--card);border-radius:8px;text-align:center;padding:6px 0;font-size:12px;color:var(--sub)}
.day b{display:block;font-size:16px;color:var(--tx)}
.day.today{background:var(--hl);color:var(--hlx);border-color:var(--hl)}.day.today b{color:var(--hlx)}
nav{position:sticky;top:env(safe-area-inset-top,0px);display:flex;gap:6px;background:var(--bg);padding:8px 0;z-index:5}
nav button{flex:1;padding:9px 0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.t{font-weight:700}.tg{color:var(--sub);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.b{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:6px;padding:4px 9px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.b.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.b.on{background:var(--hl);color:var(--hlx);border-color:var(--hl)}
.lk{font-size:12px;padding:3px 8px;color:var(--ac);border-color:var(--bd)}
input,select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);max-width:100%}
input[type=number]{width:72px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.em{color:var(--sub);padding:10px 2px}
.why{font-size:12px;color:var(--ac)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>マンガハブ</h1>
<div class="week" id="week"></div>
<nav id="nav"><button data-tab="home">ホーム</button><button data-tab="mine">マイ作品</button><button data-tab="find">発見</button></nav>
<div id="v"></div>
</main>
<script>
const P=[["ONE PIECE","少年 冒険 バトル"],["キングダム","青年 歴史 戦記"],["HUNTER×HUNTER","少年 冒険 バトル"],["SPY×FAMILY","コメディ 家族 アクション"],["呪術廻戦","少年 バトル ダーク"],["葬送のフリーレン","ファンタジー 冒険 しっとり"],["ダンダダン","少年 バトル コメディ"],["チェンソーマン","少年 バトル ダーク"],["僕のヒーローアカデミア","少年 バトル 学園"],["鬼滅の刃","少年 バトル 歴史"],["薬屋のひとりごと","ミステリー 歴史 コメディ"],["ブルーロック","スポーツ バトル"],["【推しの子】","ミステリー 芸能 ダーク"],["怪獣8号","少年 バトル SF"],["アオのハコ","スポーツ 恋愛 学園"],["ワンパンマン","コメディ バトル"],["ゴールデンカムイ","青年 歴史 冒険 バトル"],["ヴィンランド・サガ","青年 歴史 戦記"],["ダンジョン飯","ファンタジー 冒険 コメディ"],["宇宙兄弟","青年 SF 人間ドラマ"],["ハイキュー!!","スポーツ 少年 学園"],["SAKAMOTO DAYS","少年 アクション コメディ"],["魔入りました!入間くん","ファンタジー コメディ 学園"],["よつばと!","日常 コメディ ほのぼの"]];
const WD=["日","月","火","水","木","金","土"];
const K="mangahub.v2";
let S={mine:[],wish:[]},tab="home",flt="",sw="";
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
if(!S.mine.length&&!localStorage.getItem?.call(localStorage,K+".seeded")){["キングダム","ONE PIECE","HUNTER×HUNTER"].forEach(t=>S.mine.push(mk(t)));try{localStorage.setItem(K+".seeded","1")}catch(e){}}
function mk(t){const p=P.find(x=>x[0]===t);return{id:Date.now()+Math.random(),title:t,tags:p?p[1].split(" "):[],wd:"",vol:"",read:false}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const q=t=>encodeURIComponent(t);
function links(t){return `<div class="row">`+[["Kindle",`https://www.amazon.co.jp/s?k=${q(t)}&i=digital-text`],["ebookjapan",`https://ebookjapan.yahoo.co.jp/search/?keyword=${q(t)}`],["楽天",`https://books.rakuten.co.jp/search?sitem=${q(t)}&g=001`],["無料で読む",`https://www.google.com/search?q=${q(t+" 公式 無料 試し読み")}`],["電子図書館",`https://www.google.com/search?q=${q(t+" 電子図書館")}`]].map(([n,u])=>`<a class="b lk" href="${u}" target="_blank" rel="noopener">${n}</a>`).join("")+`</div>`}
const own=t=>S.mine.some(m=>m.title===t);
function rec(){const mt=new Set(S.mine.flatMap(m=>m.tags));return P.filter(p=>!own(p[0])&&!S.wish.includes(p[0])||S.wish.includes(p[0])&&!own(p[0])).map((p,i)=>{const sh=p[1].split(" ").filter(t=>mt.has(t));return{t:p[0],tags:p[1],sh,i}}).sort((a,b)=>b.sh.length-a.sh.length||a.i-b.i)}
function pcard(r,showWhy){const w=S.wish.includes(r.t);return `<div class="c"><div class="t">${esc(r.t)}</div><div class="tg">${esc(r.tags.split?r.tags.split(" ").join("・"):r.tags)}</div>${showWhy&&r.sh.length?`<div class="why">あなたの好み: ${esc(r.sh.join("・"))}</div>`:""}<div class="row"><button class="b p" data-a="add" data-t="${esc(r.t)}">＋マイ作品に追加</button><button class="b ${w?"on":""}" data-a="wish" data-t="${esc(r.t)}">${w?"★気になる":"☆気になる"}</button></div>${links(r.t)}</div>`}
function mcard(m){return `<div class="c"><div class="t">${esc(m.title)}</div><div class="tg">${esc(m.tags.join("・"))}</div><div class="row"><select data-a="wd" data-id="${m.id}" aria-label="更新曜日"><option value="">更新曜日</option>${WD.map((d,i)=>`<option value="${i}" ${String(m.wd)===String(i)?"selected":""}>${d}曜</option>`).join("")}</select><input type="number" min="0" placeholder="最新巻" value="${esc(m.vol)}" data-a="vol" data-id="${m.id}" aria-label="最新巻"><button class="b ${m.read?"on":"p"}" data-a="read" data-id="${m.id}">${m.read?"読了":"読んだ"}</button><button class="b" data-a="del" data-id="${m.id}">削除</button></div>${links(m.title)}</div>`}
function view(){
const td=new Date().getDay();
document.getElementById("week").innerHTML=WD.map((d,i)=>{const n=S.mine.filter(m=>String(m.wd)===String(i)).length;return `<div class="day ${i===td?"today":""}">${d}<b>${n||"・"}</b></div>`}).join("");
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
let h="";
if(tab==="home"){
const tdl=S.mine.filter(m=>String(m.wd)===String(td)&&!m.read),un=S.mine.filter(m=>!m.read&&!tdl.includes(m));
h+=`<h2>今日更新(${WD[td]}曜)</h2>`+(tdl.length?tdl.map(mcard).join(""):`<div class="em">今日更新の未読はありません。マイ作品で更新曜日を設定すると、ここに出ます。</div>`);
h+=`<h2>未読の作品</h2>`+(un.length?un.map(mcard).join(""):`<div class="em">未読はありません。</div>`);
const r=rec();h+=`<h2>好みに近いおすすめ</h2>`+r.slice(0,4).map(x=>pcard(x,true)).join("");
if(S.wish.length)h+=`<h2>気になるリスト</h2>`+rec().filter(x=>S.wish.includes(x.t)).map(x=>pcard(x,false)).join("");
}
if(tab==="mine"){
h+=`<div class="row"><input id="nt" placeholder="作品名を入力" style="flex:1"><button class="b p" data-a="addc">追加</button><button class="b" data-a="reset">全て未読に戻す</button></div>`;
h+=S.mine.length?S.mine.map(mcard).join(""):`<div class="em">作品がありません。上の入力か「発見」から追加してください。</div>`;
}
if(tab==="find"){
const tags=[...new Set(P.flatMap(p=>p[1].split(" ")))];
h+=`<div class="row"><input id="sq" placeholder="作品名で探す(例: ワンピース)" value="${esc(sw)}" style="flex:1"><button class="b p" data-a="sq">探す</button></div>`;
if(sw){h+=`<div class="c"><div class="t">${esc(sw)}</div>${links(sw)}<div class="row"><button class="b p" data-a="addsw">＋マイ作品に追加</button></div></div>`}
h+=`<div class="chips"><button class="b ${flt?"":"on"}" data-a="flt" data-t="">全て</button>${tags.map(t=>`<button class="b ${flt===t?"on":""}" data-a="flt" data-t="${t}">${t}</button>`).join("")}</div>`;
const l=rec().filter(x=>!flt||x.tags.split(" ").includes(flt));
h+=l.length?l.map(x=>pcard(x,true)).join(""):`<div class="em">該当する作品はありません。</div>`;
}
document.getElementById("v").innerHTML=h;
}
document.addEventListener("click",e=>{
const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;view();return}
const b=e.target.closest("[data-a]");if(!b||b.tagName==="SELECT"||b.tagName==="INPUT")return;
const a=b.dataset.a,id=b.dataset.id,ti=b.dataset.t,m=S.mine.find(x=>String(x.id)===id);
if(a==="add"&&!own(ti))S.mine.push(mk(ti));
if(a==="wish")S.wish=S.wish.includes(ti)?S.wish.filter(x=>x!==ti):[...S.wish,ti];
if(a==="read"&&m)m.read=!m.read;
if(a==="del"&&m)S.mine=S.mine.filter(x=>x!==m);
if(a==="reset")S.mine.forEach(x=>x.read=false);
if(a==="addc"){const v=document.getElementById("nt").value.trim();if(v&&!own(v))S.mine.push(mk(v))}
if(a==="sq")sw=document.getElementById("sq").value.trim();
if(a==="addsw"&&sw&&!own(sw)){S.mine.push(mk(sw));sw=""}
if(a==="flt")flt=ti;
save();view();
});
document.addEventListener("change",e=>{
const el=e.target,m=S.mine.find(x=>String(x.id)===el.dataset.id);if(!m)return;
if(el.dataset.a==="wd")m.wd=el.value;
if(el.dataset.a==="vol")m.vol=el.value;
save();view();
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="sq")document.querySelector('[data-a="sq"]').click();if(e.key==="Enter"&&e.target.id==="nt")document.querySelector('[data-a="addc"]').click()});
view();
</script>
<script>
let CFG={},ANI=[],SIM=null,TG={};
try{CFG=JSON.parse(localStorage.getItem(K+".cfg")||"{}")}catch(e){}
const _view=view,_save=save,_mk=mk;
const dbu=()=>`${CFG.db.replace(/\/$/,"")}/mangahub/${encodeURIComponent(CFG.code)}.json`;
async function push(){if(!CFG.db||!CFG.code)return;try{await fetch(dbu(),{method:"PUT",body:JSON.stringify(S)})}catch(e){}}
async function pull(){if(!CFG.db||!CFG.code)return;try{const r=await(await fetch(dbu())).json();if(r&&r.mine&&(r.ts||0)>(S.ts||0)){S=r;_save();view()}}catch(e){}}
save=function(){S.ts=Date.now();_save();push()};
mk=function(t){const m=_mk(t);if(!m.tags.length&&TG[t])m.tags=TG[t];return m};
async function gql(query,variables){const r=await fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query,variables})});return(await r.json()).data}
const nm=n=>n.title.native||n.title.romaji;
function items(l){return l.filter(x=>!own(x.t)).map(x=>pcard({t:x.t,tags:x.tags,sh:[]},false)).join("")}
view=function(){
_view();const v=document.getElementById("v");
if(tab==="set")v.innerHTML=`<h2>端末間の同期(Firebase)</h2><div class="c"><div class="tg">Realtime DatabaseのURLと、自分だけが知る同期コードを入れると、別端末と同じ内容になります。</div><div class="row"><input id="cd" placeholder="https://xxxx.firebaseio.com" value="${esc(CFG.db||"")}" style="flex:1"></div><div class="row"><input id="cc" placeholder="同期コード(長めの文字列)" value="${esc(CFG.code||"")}" style="flex:1"></div><div class="row"><button class="b p" data-a="cfg">保存して同期</button></div></div>`;
if(tab==="find")v.insertAdjacentHTML("afterbegin",`<h2>AniListの人気作</h2><div class="row"><button class="b p" data-a="ani">人気ランキングを取得</button></div>`+(ANI.length?items(ANI):""));
if(SIM&&(tab==="mine"||tab==="home"))v.insertAdjacentHTML("afterbegin",`<h2>「${esc(SIM.f)}」に似た作品</h2>`+(SIM.l.length?items(SIM.l):`<div class="em">見つかりませんでした。</div>`));
if(tab==="mine"||tab==="home")v.querySelectorAll('[data-a="del"]').forEach(b=>{const t=b.closest(".c").querySelector(".t").textContent;b.insertAdjacentHTML("beforebegin",`<button class="b" data-a="sim" data-t="${esc(t)}">似た作品</button>`)});
};
document.querySelector("nav").insertAdjacentHTML("beforeend",'<button data-tab="set">設定</button>');
document.addEventListener("click",async e=>{
const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
try{
if(a==="ani"){b.textContent="取得中…";const d=await gql(`query{Page(perPage:14){media(type:MANGA,countryOfOrigin:"JP",sort:POPULARITY_DESC,isAdult:false){title{native romaji}genres}}}`);ANI=d.Page.media.map(n=>{TG[nm(n)]=n.genres;return{t:nm(n),tags:n.genres.join(" ")}});view()}
if(a==="sim"){const d=await gql(`query($s:String){Media(search:$s,type:MANGA){recommendations(sort:RATING_DESC,perPage:10){nodes{mediaRecommendation{title{native romaji}genres isAdult}}}}}`,{s:b.dataset.t});const l=(d.Media?.recommendations?.nodes||[]).map(n=>n.mediaRecommendation).filter(n=>n&&!n.isAdult).map(n=>{TG[nm(n)]=n.genres;return{t:nm(n),tags:n.genres.join(" ")}});SIM={f:b.dataset.t,l};view()}
if(a==="cfg"){CFG={db:document.getElementById("cd").value.trim(),code:document.getElementById("cc").value.trim()};localStorage.setItem(K+".cfg",JSON.stringify(CFG));await pull();await push();view()}
}catch(err){}
});
pull();
</script>
</body>
</html>
