<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マンガハブ">
<title>マンガハブ</title>
<style>
:root{--bg:#f1f3f6;--card:#fff;--ink:#14161a;--sub:#5d6470;--ac:#2f4bff;--hl:#ffd400;--on-ac:#fff;--dot:rgba(20,22,26,.13);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--card:#1a1d23;--ink:#f1f3f6;--sub:#9aa2af;--ac:#7f93ff;--hl:#ffd400;--on-ac:#101216;--dot:rgba(241,243,246,.14);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101216;--card:#1a1d23;--ink:#f1f3f6;--sub:#9aa2af;--ac:#7f93ff;--hl:#ffd400;--on-ac:#101216;--dot:rgba(241,243,246,.14);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:0 16px}
.top{margin:0 -16px 18px;padding:22px 16px 18px;background:radial-gradient(var(--dot) 1.4px,transparent 1.6px) 0 0/9px 9px;border-bottom:3px solid var(--ink)}
.top h1{margin:0;font-size:30px;font-weight:900;letter-spacing:.02em;line-height:1.2}
.top p{margin:4px 0 0;color:var(--sub);font-weight:700;font-size:14px}
h2{font-size:15px;margin:22px 0 10px;font-weight:800}
.card{background:var(--card);border:2px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);padding:12px 14px;margin:0 3px 14px 0;display:flex;gap:12px;align-items:center}
.card.done{opacity:.5;box-shadow:none}
.card .t{flex:1;min-width:0}
.card .t b{display:block;font-size:17px;line-height:1.35;word-break:break-word}
.card .t small{color:var(--sub);font-size:13px;font-weight:600}
.btn{appearance:none;font:inherit;font-weight:800;font-size:15px;border:2px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink);padding:9px 14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px;cursor:pointer}
.btn.p{background:var(--ac);color:var(--on-ac)}
.btn.y{background:var(--hl);color:#14161a}
.btn.d{color:#d0342c}
.btn:active{transform:translate(2px,2px)}
.btn.w{width:100%;margin-bottom:10px}
.tag{display:inline-block;background:var(--hl);color:#14161a;font-weight:800;font-size:12px;padding:1px 7px;border-radius:3px;margin-right:6px}
.empty{border:2px dashed var(--sub);border-radius:6px;padding:22px 16px;color:var(--sub);text-align:center;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:3px solid var(--ink);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;appearance:none;border:0;background:none;color:var(--sub);font:inherit;font-weight:800;font-size:13px;padding:8px 0;min-height:48px;cursor:pointer}
nav button.on{color:var(--ink);box-shadow:inset 0 -4px 0 var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:4;width:56px;height:56px;border-radius:50%;font-size:30px;line-height:1;box-shadow:3px 3px 0 var(--ink);padding:0}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
#sheet .in{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-top:3px solid var(--ink);border-radius:14px 14px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px))}
#sheet h3{margin:0 0 12px;font-size:20px;font-weight:900;word-break:break-word}
label{display:block;font-weight:800;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=url],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:10px 12px;min-height:46px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;font:inherit;font-weight:800;width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ac);color:var(--on-ac)}
.row{display:flex;gap:10px}.row>*{flex:1}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;margin:0;padding:10px 0;border-bottom:1px solid var(--dot)}
.chk input{width:22px;height:22px}
textarea{min-height:90px;font-size:13px}
.note{color:var(--sub);font-size:13px;margin:6px 0}
</style>
</head>
<body>
<main id="main"></main>
<button class="btn p fab" id="fab" data-a="new" aria-label="作品を追加">＋</button>
<nav>
<button data-a="tab" data-id="today">今日</button>
<button data-a="tab" data-id="list">マイ作品</button>
<button data-a="tab" data-id="find">発見</button>
<button data-a="tab" data-id="set">設定</button>
</nav>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<script>
const APPS=[["jp","ジャンプ+","https://shonenjumpplus.com/"],["mp","マガポケ","https://pocket.shonenmagazine.com/"],["mo","マンガワン","https://manga-one.com/"],["su","サンデーうぇぶり","https://websunday.net/"],["pc","ピッコマ","https://piccoma.com/web"],["ln","LINEマンガ","https://manga.line.me/"],["zb","ゼブラック","https://zebrack-comic.shueisha.co.jp/"],["yj","ヤンジャン！","https://youngjump.jp/"],["ot","その他",""]];
const SHOPS=[["kindle","Kindle","https://www.amazon.co.jp/s?i=digital-text&k="],["kobo","楽天Kobo","https://kobo.com/jp/ja/search?query="],["bw","BookWalker","https://bookwalker.jp/search/?word="],["cmoa","コミックシーモア","https://www.cmoa.jp/search/result/?header_word="],["rb","楽天ブックス（紙）","https://books.rakuten.co.jp/search?sitem="],["az","Amazon（紙）","https://www.amazon.co.jp/s?i=stripbooks&k="]];
const CATALOG=[["ONE PIECE","jp",[1],"週刊少年ジャンプ連載"],["HUNTER×HUNTER","jp",[1],"週刊少年ジャンプ連載・休載が多い"],["キングダム","yj",[4],"週刊ヤングジャンプ連載"]];
const P=[["ONE PIECE","少年 冒険 バトル"],["キングダム","青年 歴史 戦記"],["HUNTER×HUNTER","少年 冒険 バトル"],["SPY×FAMILY","コメディ 家族 アクション"],["呪術廻戦","少年 バトル ダーク"],["葬送のフリーレン","ファンタジー 冒険 しっとり"],["ダンダダン","少年 バトル コメディ"],["チェンソーマン","少年 バトル ダーク"],["鬼滅の刃","少年 バトル 歴史"],["薬屋のひとりごと","ミステリー 歴史 コメディ"],["ブルーロック","スポーツ バトル"],["怪獣8号","少年 バトル SF"],["ゴールデンカムイ","青年 歴史 冒険 バトル"],["ヴィンランド・サガ","青年 歴史 戦記"],["ダンジョン飯","ファンタジー 冒険 コメディ"],["宇宙兄弟","青年 SF 人間ドラマ"],["ハイキュー!!","スポーツ 少年 学園"],["SAKAMOTO DAYS","少年 アクション コメディ"]];
const DN="日月火水木金土",KEY="mangahub:v1";
let S={works:[],shops:["kindle","bw"],wish:[],wU:0},tab="today";
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.del=S.del||{};S.sU=S.sU||0;S.wish=S.wish||[];S.wU=S.wU||0;S.works.forEach(w=>{if(!w.u)w.u=Date.now()});
const lsSave=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let ref=null,st="local",pt=null;
const pack=()=>({works:S.works,shops:S.shops,del:S.del,sU:S.sU,wish:S.wish,wU:S.wU});
const save=()=>{lsSave();push()};
const sj=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
function push(){rdeb();if(!ref)return;clearTimeout(pt);pt=setTimeout(()=>{ref.set(JSON.parse(JSON.stringify(pack()))).then(()=>{st="ok";badge()}).catch(()=>{st="err";badge()})},400)}
function merge(r){
  const del=Object.assign({},S.del,r.del||{}),m=new Map();
  [...S.works,...(r.works||[]).map(w=>Object.assign({days:[]},w))].forEach(w=>{const o=m.get(w.id);if(!o||(w.u||0)>(o.u||0))m.set(w.id,w)});
  const works=[...m.values()].filter(w=>!(del[w.id]>(w.u||0)));
  const useR=(r.sU||0)>S.sU&&Array.isArray(r.shops);
  const useW=(r.wU||0)>S.wU&&Array.isArray(r.wish);const n={works,shops:useR?r.shops:S.shops,del,sU:Math.max(S.sU,r.sU||0),wish:useW?r.wish:S.wish,wU:Math.max(S.wU,r.wU||0)};
  const ch=sj(n)!==sj(pack());
  Object.assign(S,n);return ch;
}
const syncTxt=()=>st==="ok"?"☁ 同期済み":st==="sync"?"☁ 同期中…":st==="err"?"同期エラー（この端末には保存済み）":"この端末のみ保存";
function badge(){document.querySelectorAll(".sync").forEach(e=>e.textContent=syncTxt())}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=id=>APPS.find(a=>a[0]===id)||APPS[8];
const ymd=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const today=()=>new Date();
const readUrl=w=>w.url||app(w.app)[2];
const dayLabel=w=>w.days.length?w.days.slice().sort().map(d=>DN[d]).join("・")+"曜":"不定期";
function until(w){const n=today().getDay();let m=9;w.days.forEach(d=>{m=Math.min(m,(d-n+7)%7)});return m}
function card(w,extra){
  const a=app(w.app),done=w.read===ymd(today());
  return `<div class="card ${done?"done":""}"><div class="t" data-a="open" data-id="${w.id}"><b>${esc(w.title)}</b><small>${esc(a[1])}${extra?" ／ "+extra:""}</small></div>
  <a class="btn p" href="${esc(readUrl(w))||"#"}" target="_blank" rel="noopener" data-a="read" data-id="${w.id}">${done?"読了":"読む"}</a></div>`;
}
function vToday(){
  const d=today(),ws=S.works,td=ws.filter(w=>w.days.includes(d.getDay())),rest=ws.filter(w=>!w.days.includes(d.getDay())).sort((a,b)=>until(a)-until(b));
  let h=`<div class="top"><h1>${d.getMonth()+1}月${d.getDate()}日（${DN[d.getDay()]}）</h1><p>今日更新 ${td.length}作品 ／ <span class="sync">${syncTxt()}</span></p></div>`;
  if(!ws.length)return h+`<div class="empty">まだ作品がありません。<br>右下の＋から、読んでいる漫画を登録しましょう。</div>`;
  h+=td.length?td.map(w=>card(w)).join(""):`<div class="empty">今日更新の作品はありません</div>`;
  if(rest.length)h+=`<h2>これから更新</h2>`+rest.map(w=>card(w,w.days.length?(until(w)===1?"明日":until(w)+"日後")+"（"+dayLabel(w)+"）":"不定期")).join("");
  return h;
}
function vList(){
  const ws=S.works.slice().sort((a,b)=>app(a.app)[1].localeCompare(app(b.app)[1],"ja"));
  let h=`<div class="top"><h1>マイ作品</h1><p>${ws.length}作品</p></div>`;
  if(!ws.length)return h+`<div class="empty">右下の＋から作品を追加できます</div>`;
  return h+ws.map(w=>card(w,dayLabel(w))).join("");
}
function vSet(){
  return `<div class="top"><h1>設定</h1><p>購入ボタンに出す書店を選べます ／ <span class="sync">${syncTxt()}</span></p></div>
  ${SHOPS.map(s=>`<label class="chk"><input type="checkbox" data-a="shop" data-id="${s[0]}" ${S.shops.includes(s[0])?"checked":""}>${s[1]}</label>`).join("")}
  <h2>端末の同期</h2>
  <p class="note">パソコン・スマホ・ホーム画面のアプリで、同じ同期コードを入れると同じリストになります（各端末で1回だけ）。</p>
  <input type="text" id="sc" value="${esc(code)}" placeholder="例：hiro-manga-2026（他人に推測されにくい文字列）">
  <button class="btn w" style="margin-top:10px" data-a="setcode">この同期コードで同期する</button>
  <h2>バックアップ</h2>
  <p class="note">claude.aiに同じアカウントでログインしていれば、iPhoneとパソコンで自動的に同期されます。ログインできない場合のバックアップとして、下の書き出しも使えます。</p>
  <button class="btn w" data-a="export">データを書き出す</button>
  <textarea id="bk" placeholder="書き出した文字列をここに貼って読み込み"></textarea>
  <button class="btn w" style="margin-top:10px" data-a="import">貼り付けたデータを読み込む</button><p class="note" id="msg"></p>`;
}
const FREE="https://www.google.com/search?q=",have=t=>S.works.some(w=>w.title===t);
let flt="",sw="";
function recs(){const mt=new Set(S.works.flatMap(w=>{const p=P.find(x=>x[0]===w.title);return p?p[1].split(" "):[]}));return P.map((p,i)=>({t:p[0],g:p[1],i,sh:p[1].split(" ").filter(x=>mt.has(x))})).filter(r=>!have(r.t)).sort((a,b)=>(S.wish.includes(b.t)-S.wish.includes(a.t))||b.sh.length-a.sh.length||a.i-b.i)}
const fl=t=>`<a class="btn" href="${FREE+encodeURIComponent(t+" 公式 無料 試し読み")}" target="_blank" rel="noopener">無料で読む</a><a class="btn" href="${SHOPS[0][2]+encodeURIComponent(t)}" target="_blank" rel="noopener">Kindle</a>`;
function fcard(r){const w=S.wish.includes(r.t);return `<div class="card" style="display:block"><div class="t"><b>${esc(r.t)}</b><small>${esc(r.g.split(" ").join("・"))}</small>${r.sh.length?`<br><small style="color:var(--ac)">好みに近い：${esc(r.sh.join("・"))}</small>`:""}</div><div class="row" style="margin-top:10px"><button class="btn p" data-a="addr" data-id="${r.i}">＋マイ作品</button><button class="btn ${w?"y":""}" data-a="wish" data-id="${r.i}">${w?"★気になる":"☆気になる"}</button></div><div class="row" style="margin-top:8px">${fl(r.t)}</div></div>`}
function vFind(){
  const tags=[...new Set(P.flatMap(p=>p[1].split(" ")))],cs="flex:0 0 auto;min-height:36px;padding:4px 12px;",on="background:var(--hl);color:#14161a;";
  let h=`<div class="top"><h1>発見</h1><p>好みに近い作品・人気作</p></div><div class="row"><input type="text" id="sq" placeholder="作品名で探す" value="${esc(sw)}"><button class="btn p" style="flex:0 0 auto" data-a="sq">探す</button></div>`;
  if(sw)h+=`<div class="card" style="display:block;margin-top:12px"><div class="t"><b>${esc(sw)}</b></div><div class="row" style="margin-top:10px"><button class="btn p" data-a="addsw">＋マイ作品</button>${fl(sw)}</div></div>`;
  h+=`<div class="row" style="flex-wrap:wrap;margin:14px 0 8px"><button class="btn" style="${cs}${flt?"":on}" data-a="flt" data-id="">全て</button>${tags.map(t=>`<button class="btn" style="${cs}${flt===t?on:""}" data-a="flt" data-id="${t}">${t}</button>`).join("")}</div>`;
  const l=recs().filter(r=>!flt||r.g.split(" ").includes(flt));
  return h+(l.length?l.map(fcard).join(""):`<div class="empty">該当する作品はありません</div>`);
}
function render(){
  $("#main").innerHTML=tab==="today"?vToday():tab==="list"?vList():tab==="find"?vFind():vSet();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.id===tab));
  $("#fab").style.display=tab==="set"||tab==="find"?"none":"";
}
function sheet(h){$("#sheetIn").innerHTML=h;$("#sheet").classList.add("open")}
function closeSheet(){$("#sheet").classList.remove("open")}
function detail(id){
  const w=S.works.find(x=>x.id===id);if(!w)return;
  const sh=SHOPS.filter(s=>S.shops.includes(s[0]));
  sheet(`<h3>${esc(w.title)}</h3><p class="note">${esc(app(w.app)[1])} ／ ${dayLabel(w)}${w.note?" ／ "+esc(w.note):""}</p>
  <a class="btn p w" href="${esc(readUrl(w))||"#"}" target="_blank" rel="noopener" data-a="read" data-id="${w.id}">本元で読む</a>
  <h2>単行本を買う</h2>
  ${sh.length?sh.map(s=>`<a class="btn y w" href="${s[2]+encodeURIComponent(w.title)}" target="_blank" rel="noopener">${s[1]}で探す</a>`).join(""):`<p class="note">設定で書店を選んでください</p>`}
  <a class="btn w" href="${FREE+encodeURIComponent(w.title+" 公式 無料 試し読み")}" target="_blank" rel="noopener">無料・試し読みを探す</a>
  <div class="row" style="margin-top:8px"><button class="btn" data-a="edit" data-id="${w.id}">編集</button><button class="btn d" data-a="del" data-id="${w.id}">削除</button></div>
  <button class="btn w" style="margin-top:10px" data-a="close">閉じる</button>`);
}
function pickHtml(){
  const have=S.works.map(w=>w.title),l=CATALOG.map((c,i)=>[c,i]).filter(([c])=>!have.includes(c[0]));
  if(!l.length)return "";
  return `<h2>作品を選んで追加</h2>${l.map(([c,i])=>`<button class="btn w" style="justify-content:space-between;text-align:left" data-a="pick" data-id="${i}"><span>${esc(c[0])}</span><span class="note" style="margin:0">${esc(app(c[1])[1])}・${c[2].map(d=>DN[d]).join("・")}曜</span></button>`).join("")}<h2>リストにない作品は手入力</h2>`;
}
function form(id){
  const w=S.works.find(x=>x.id===id)||{title:"",app:"jp",days:[],url:"",note:""};
  sheet(`<h3>${id?"作品を編集":"作品を追加"}</h3>${id?"":pickHtml()}
  <label>タイトル</label><input type="text" id="f_t" value="${esc(w.title)}" placeholder="例：作品名">
  <label>掲載アプリ</label><select id="f_a">${APPS.map(a=>`<option value="${a[0]}" ${a[0]===w.app?"selected":""}>${a[1]}</option>`).join("")}</select>
  <label>更新曜日（複数選べます）</label><div class="chips">${[...DN].map((c,i)=>`<button type="button" class="chip ${w.days.includes(i)?"on":""}" data-a="day">${c}</button>`).join("")}</div>
  <label>作品ページのURL（任意）</label><input type="url" id="f_u" value="${esc(w.url)}" placeholder="https://">
  <p class="note">空欄なら、掲載アプリのトップページを開きます。</p>
  <label>メモ（任意）</label><input type="text" id="f_n" value="${esc(w.note)}">
  <div class="row" style="margin-top:18px"><button class="btn" data-a="close">キャンセル</button><button class="btn p" data-a="save" data-id="${id||""}">保存</button></div>`);
}
const act={
  tab(id){tab=id;render();scrollTo(0,0)},
  setcode(){code=$("#sc").value.trim();try{localStorage.setItem("mangahub:code",code)}catch(e){}pull();render()},
  sq(){sw=$("#sq").value.trim();render()},
  flt(id){flt=id;render()},
  wish(i){const t=P[i][0];S.wish=S.wish.includes(t)?S.wish.filter(x=>x!==t):[...S.wish,t];S.wU=Date.now();save();render()},
  addr(i){const p=P[i];if(!p||have(p[0]))return;S.works.push({id:"w"+Date.now(),title:p[0],app:"ot",days:[],url:FREE+encodeURIComponent(p[0]+" 公式 無料 試し読み"),note:"",u:Date.now()});save();render()},
  addsw(){if(!sw||have(sw))return;S.works.push({id:"w"+Date.now(),title:sw,app:"ot",days:[],url:FREE+encodeURIComponent(sw+" 公式 無料 試し読み"),note:"",u:Date.now()});sw="";save();render()},
  new(){form("")},
  pick(i){const c=CATALOG[i];if(!c)return;S.works.push({id:"w"+Date.now(),title:c[0],app:c[1],days:c[2].slice(),url:"",note:c[3]||"",u:Date.now()});save();closeSheet();tab="list";render()},
  open(id){detail(id)},
  edit(id){form(id)},
  close(){closeSheet()},
  day(_,el){el.classList.toggle("on")},
  save(id){
    const t=$("#f_t").value.trim();if(!t){$("#f_t").focus();return}
    const days=[...document.querySelectorAll(".chip")].map((c,i)=>c.classList.contains("on")?i:-1).filter(i=>i>=0);
    const o={title:t,app:$("#f_a").value,days,url:$("#f_u").value.trim(),note:$("#f_n").value.trim(),u:Date.now()};
    if(id){Object.assign(S.works.find(x=>x.id===id),o)}else{S.works.push(Object.assign({id:"w"+Date.now()},o))}
    save();closeSheet();render();
  },
  del(id,el){if(el.dataset.arm!=="1"){el.dataset.arm="1";el.textContent="もう一度押すと削除";return}S.works=S.works.filter(x=>x.id!==id);S.del[id]=Date.now();save();closeSheet();render()},
  read(id){const w=S.works.find(x=>x.id===id);if(w){w.read=ymd(today());w.u=Date.now();save();setTimeout(()=>{closeSheet();render()},400)}},
  shop(id,el){S.shops=el.checked?[...new Set([...S.shops,id])]:S.shops.filter(x=>x!==id);S.sU=Date.now();save()},
  export(){$("#bk").value=JSON.stringify(S);$("#bk").select()},
  import(){try{const d=JSON.parse($("#bk").value);if(!Array.isArray(d.works))throw 0;S=Object.assign({works:[],shops:["kindle","bw"],del:{},sU:Date.now(),wish:[],wU:0},d);S.del=S.del||{};S.wish=S.wish||[];S.works.forEach(w=>{if(!w.u)w.u=Date.now()});save();tab="list";render()}catch(e){$("#msg").textContent="読み込めませんでした。書き出した文字列をそのまま貼ってください。"}}
};
document.addEventListener("click",e=>{
  if(e.target.id==="sheet"){closeSheet();return}
  const t=e.target.closest("[data-a]");if(!t)return;
  const f=act[t.dataset.a];if(f)f(t.dataset.id,t);
});

const FB_URL="https://manga-hub-142af-default-rtdb.asia-southeast1.firebasedatabase.app";
let code="";try{code=localStorage.getItem("mangahub:code")||""}catch(e){}
const rurl=()=>FB_URL&&code?FB_URL.replace(/\/$/,"")+"/mangahub/"+encodeURIComponent(code)+".json":"";
const norm=d=>({works:(d.works||[]).map(w=>Object.assign({days:[]},w)),shops:d.shops||[],del:d.del||{},sU:d.sU||0,wish:d.wish||[],wU:d.wU||0});
let rt=null;
function rdeb(){clearTimeout(rt);rt=setTimeout(rpush,600)}
async function rpush(){const u=rurl();if(!u)return;try{const r=await fetch(u,{method:"PUT",body:JSON.stringify(pack())});st=r.ok?"ok":"err"}catch(e){st="err"}badge()}
async function pull(){const u=rurl();if(!u)return;try{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();if(d){const nd=norm(d);if(merge(nd)){lsSave();render()}if(sj(norm(pack()))!==sj(nd))await rpush();else{st="ok";badge()}}else await rpush()}catch(e){st="err";badge()}}
pull();setInterval(pull,20000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
(async()=>{try{
  const db=await claude.use("db"),user=await claude.use("user");
  if(!db||!user)return;
  const uid=await user.id();if(!uid)return;
  ref=db.collection("data/users/"+uid).doc("mangahub");st="sync";badge();
  ref.onSnapshot(s=>{
    const r=s.exists?s.data():null;
    if(r){
      if(merge(r)){lsSave();render()}
      const rp=JSON.stringify({works:r.works||[],shops:r.shops||[],del:r.del||{},sU:r.sU||0,wish:r.wish||[],wU:r.wU||0});
      if(JSON.stringify(pack())!==rp)push();else{st="ok";badge()}
    }else push();
  },()=>{st="err";badge()});
}catch(e){}})();
